services:
  clamav:
    image: clamav/clamav:1.4
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['monitoring']
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['monitoring']
    ports:
      - '3001:3000'

