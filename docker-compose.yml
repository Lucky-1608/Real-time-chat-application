services:
  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/chat-app
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-jwt-secret-must-be-at-least-32-chars
      ENCRYPTION_KEY: local-dev-encryption-key-at-least-32-chars
      CLIENT_URL: http://localhost:5173
      CLAMD_HOST: clamav
      CLAMD_PORT: 3310
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
    ports:
      - '5173:80'
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['monitoring']
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['monitoring']
    ports:
      - '3001:3000'

volumes:
  mongo_data:
